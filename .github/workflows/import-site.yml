name: Transférer les candidats du site vers la CVthèque

on:
  workflow_dispatch:
    inputs:
      essai:
        description: "Simulation seulement (oui = compter sans rien écrire, non = transférer pour de vrai)"
        required: true
        default: "oui"
        type: choice
        options: ["oui", "non"]

permissions:
  contents: read

jobs:
  importer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les outils
        run: npm install --no-save --no-audit --no-fund pg@8.16.3 @supabase/supabase-js@2.117.3
      - name: Transférer
        env:
          SITE_DATABASE_URL: ${{ secrets.SITE_DATABASE_URL }}
          SUPABASE_URL: https://orgnclnbwrmsuluntmrr.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ESSAI: ${{ inputs.essai }}
        run: node scripts/import-site.mjs
